url: https://tomwenseleers.github.io/logconNMF/
title: logconNMF
repo:
  url:
    home: https://github.com/tomwenseleers/logconNMF/
    source: https://github.com/tomwenseleers/logconNMF/blob/master/logconNMF/
    issue: https://github.com/tomwenseleers/logconNMF/issues
    user: https://github.com/
destination: ../docs
template:
  bootstrap: 5
  theme: github-dark
  math-rendering: katex
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "logconNMF hex logo with log-concave profiles and corresponding spectra"
  bslib:
    bg: "#fcfdfd"
    fg: "#203047"
    primary: "#087e83"
    base_font: "system-ui"
    heading_font: "system-ui"
    code_font: "system-ui"
    border-radius: 0.6rem
    navbar-bg: "#081629"
navbar:
  bg: dark
  type: dark
  structure:
    left: [intro, tutorials, algorithm, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/log-concave-nmf.html
    tutorials:
      text: Tutorials
      menu:
        - text: Estimate PSFs
          href: articles/estimate-psf.html
        - text: Sparse log-concave NMF with automatic best rank tuning
          href: articles/log-concave-nmf.html
        - text: Simultaneous multisample log-concave NMF with automatic best rank tuning
          href: articles/simultaneous-nmf.html
    algorithm:
      text: Algorithm & theory
      href: articles/algorithm.html
    github:
      icon: fab fa-github
      aria-label: GitHub repository
      href: https://github.com/tomwenseleers/logconNMF
home:
  strip_header: false
  title: "logconNMF: Log-Concave Nonnegative Matrix Factorization with Automatic Rank Selection"
  sidebar:
    structure: [links, citation, authors, license]
authors:
  sidebar:
    roles: [aut, cre, ctb]

articles:
  - title: Tutorials
    contents: [articles/estimate-psf, articles/log-concave-nmf, articles/simultaneous-nmf]
  - title: Algorithm and theory
    contents: [articles/algorithm]
reference:
  - title: Estimate point spread functions and deconvolve signals
    contents: [convKernel, convMatrix, estimatePSF, estimatePSFFromStd, l0glmBlindDeco, l0glmSparseDeco, l0glmDecoEstKernel]
  - title: Sparse and simultaneous factorization
    contents: [logconNMF, splogconNMF, channelGroups, aggregateChannels]
  - title: Noise calibration and profile constraints
    contents: [estimateSignalNoise, logConcSmooth]
  - title: Simulations and experimental data
    contents: [simulateGCMS, simulateGCMSSamples, gcmsData1, gcmsData2]
  - title: Shared tools and package overview
    contents: [reexports, logconNMF-package]
